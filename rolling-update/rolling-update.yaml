---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-dpl
spec:
  replicas: 4 # 100%
  # default is RollingUpdate
  # strategy:
  #   type: Recreate
  strategy:
    rollingUpdate:
      maxSurge: 1 # 25%
      maxUnavailable: 1 # 25%
  selector:
    matchLabels:
      app: demo-rolling
  template:
    metadata:
      labels:
        app: demo-rolling
    spec:
      containers:
      - name: myapp-cont
        # image: nginx
        image: chanchhayy/reactjs-sonar-webhook:v1.0.3
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    app: demo-rolling
  ports:
  - port: 80
    targetPort: 80

