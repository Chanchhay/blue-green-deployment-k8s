---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-dpl
spec:
  replicas: 4
  # default is RollingUpdate
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recreate-strategy
  template:
    metadata:
      labels:
        app: recreate-strategy
    spec:
      containers:
      - name: myapp-cont
        #image: nginx
        image: chanchhayy/reactjs-sonar-webhook:v1.0.3
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
spec:
  selector:
    app: recreate-strategy
  ports:
  - port: 80
    targetPort: 80
